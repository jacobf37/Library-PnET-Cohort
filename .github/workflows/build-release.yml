name: Build DLL and Publish Release

permissions:
  contents: write
  actions: write
  id-token: write

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      notes:
        type: string
        required: false

  workflow_dispatch:
    inputs:
      version:
        type: string
        required: true
      notes:
        type: string
        required: false

  push:
    tags:
      - "v*"

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      # --------------------------------------------------
      # CHECKOUT (persist credentials so we can commit/push)
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      # --------------------------------------------------
      # DETERMINE VERSION
      # --------------------------------------------------
      - name: Determine version
        id: version
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -or "${{ github.event_name }}" -eq "workflow_call") {
              echo "v=${{ inputs.version }}" >> $env:GITHUB_OUTPUT
              exit 0
          }

          if ("${{ github.ref }}".StartsWith("refs/tags/")) {
              $clean = "${{ github.ref_name }}".TrimStart("v")
              echo "v=$clean" >> $env:GITHUB_OUTPUT
              exit 0
          }

          Write-Error "No valid version source found."

      # --------------------------------------------------
      # ADD MYGET FEED (fixes Landis.Core restore errors)
      # --------------------------------------------------
      - name: Add MyGet LANDIS-II feed
        run: dotnet nuget add source "https://www.myget.org/F/landis-ii-v8/api/v3/index.json" --name LANDIS-II-V8

      - name: List NuGet sources (debug)
        run: dotnet nuget list source

      # --------------------------------------------------
      # UPDATE VERSION IN CSPROJ
      # --------------------------------------------------
      - name: Update csproj version fields
        run: |
          $v = "${{ steps.version.outputs.v }}"
          $csproj = Get-ChildItem -Path . -Filter *.csproj -Recurse | Select-Object -First 1

          $xml = Get-Content $csproj.FullName

          $xml = $xml -replace '<Version>.*?</Version>', "<Version>$v</Version>"
          $xml = $xml -replace '<AssemblyVersion>.*?</AssemblyVersion>', "<AssemblyVersion>$v</AssemblyVersion>"
          $xml = $xml -replace '<FileVersion>.*?</FileVersion>', "<FileVersion>$v</FileVersion>"

          Set-Content $csproj.FullName $xml
          Write-Host "Updated version fields in $($csproj.FullName)"

      # --------------------------------------------------
      # INSTALL .NET SDK
      # --------------------------------------------------
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # --------------------------------------------------
      # BUILD DLL
      # --------------------------------------------------
      - name: Restore
        run: |
          $csproj = Get-ChildItem -Path . -Filter *.csproj -Recurse | Select-Object -First 1
          dotnet restore $csproj.FullName

      - name: Build
        run: |
          $csproj = Get-ChildItem -Path . -Filter *.csproj -Recurse | Select-Object -First 1
          dotnet build $csproj.FullName --configuration Release

      # --------------------------------------------------
      # MOVE OLD DLLs (archive)
      # --------------------------------------------------
      - name: Move previous DLLs to past-releases
        run: |
          $pastDir = "./deploy/past-releases"
          if (-not (Test-Path $pastDir)) {
            New-Item -ItemType Directory -Path $pastDir | Out-Null
          }

          # Only move DLLs from a Release directory
          $dlls = Get-ChildItem -Path . -Recurse -Filter *.dll | Where-Object { $_.FullName -match 'bin\\Release' }

          foreach ($dll in $dlls) {
            Write-Host "Archiving previous DLL: $($dll.Name)"
            Move-Item $dll.FullName $pastDir -Force
          }

      # --------------------------------------------------
      # CREATE RELEASE & UPLOAD DLL
      # --------------------------------------------------
      - name: Upload Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', steps.version.outputs.v) || github.ref_name }}
          name: "Release v${{ steps.version.outputs.v }}"
          body: ${{ inputs.notes }}
          files: |
            **/bin/Release/*.dll
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------
      # COMMIT VERSION UPDATES
      # --------------------------------------------------
      - name: Commit version updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          # Commit only if changes exist
          if (git diff --cached --quiet) {
              Write-Host "No changes to commit."
          } else {
              git commit -m "Update DLL project version to ${{ steps.version.outputs.v }}"
              git push
          }
