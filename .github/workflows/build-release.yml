name: Build DLL and Publish Release

permissions:
  contents: write
  actions: write
  id-token: write

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      notes:
        type: string
        required: false

  workflow_dispatch:
    inputs:
      version:
        type: string
        required: true
      notes:
        type: string
        required: false

  push:
    tags:
      - "v*"

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # DETERMINE VERSION
      # --------------------------------------------------
      - name: Determine version
        id: version
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -or "${{ github.event_name }}" -eq "workflow_call") {
              echo "v=${{ inputs.version }}" >> $env:GITHUB_OUTPUT
              exit 0
          }

          if ("${{ github.ref }}".StartsWith("refs/tags/")) {
              $clean = "${{ github.ref_name }}".TrimStart("v")
              echo "v=$clean" >> $env:GITHUB_OUTPUT
              exit 0
          }

          Write-Error "No valid version source found."

      # --------------------------------------------------
      # UPDATE VERSION IN CSPROJ
      # --------------------------------------------------
      - name: Update csproj version fields
        run: |
          $v = "${{ steps.version.outputs.v }}"
          $csproj = Get-ChildItem -Path . -Filter *.csproj -Recurse | Select-Object -First 1

          $xml = Get-Content $csproj.FullName

          $xml = $xml -replace '<Version>.*?</Version>', "<Version>$v</Version>"
          $xml = $xml -replace '<AssemblyVersion>.*?</AssemblyVersion>', "<AssemblyVersion>$v</AssemblyVersion>"
          $xml = $xml -replace '<FileVersion>.*?</FileVersion>', "<FileVersion>$v</FileVersion>"

          Set-Content $csproj.FullName $xml

      # --------------------------------------------------
      # Install .NET
      # --------------------------------------------------
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # --------------------------------------------------
      # BUILD DLL
      # --------------------------------------------------
      - name: Restore
        run: |
          $csproj = Get-ChildItem -Path . -Filter *.csproj -Recurse | Select-Object -First 1
          dotnet restore $csproj.FullName

      - name: Build
        run: |
          $csproj = Get-ChildItem -Path . -Filter *.csproj -Recurse | Select-Object -First 1
          dotnet build $csproj.FullName --configuration Release

      # --------------------------------------------------
      # MOVE PREVIOUS DLL TO past-releases
      # --------------------------------------------------
      - name: Move previous DLLs
        run: |
          $dllDir = "./bin/Release"
          $pastDir = "./deploy/past-releases"

          if (-not (Test-Path $pastDir)) {
            New-Item -ItemType Directory -Path $pastDir | Out-Null
          }

          $old = Get-ChildItem $dllDir -Filter "*.dll"

          foreach ($f in $old) {
            Move-Item $f.FullName $pastDir -Force
          }

      # --------------------------------------------------
      # CREATE RELEASE AND ATTACH DLL
      # --------------------------------------------------
      - name: Upload Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', steps.version.outputs.v) || github.ref_name }}
          name: "DLL Release v${{ steps.version.outputs.v }}"
          body: ${{ inputs.notes }}
          files: |
            **/bin/Release/*.dll
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------
      # COMMIT VERSION UPDATE (OPTIONAL)
      # --------------------------------------------------
      - name: Commit version updates
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .
          git commit -m "Update project version to ${{ steps.version.outputs.v }}"
          git push
